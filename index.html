<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quirky: Sign Up</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <main>

            <div class="container">

                <div class="headerText">
                    <h1 id="head1">Quirky</h1>

                    <p class="description">Be real and unapologetically <span>yourself.</span></p>
                    <p>Create an account.</p>
                </div>

                <form class="signUpForm">

                    <input type="text" id="signUpUsername" placeholder="Username" name="username" required>

                    <div class="showPassword">

                        <input type="password" class="password" id="signUpPassword" placeholder="Password" name="signUpPassword" required>

                        <button type="button" class="showPasswordBtn btn1">Show</button>
                        
                    </div>

                    <div class="showPassword">

                        <div id="passCheck">
                            <input type="password" class="password" id="confirmPassword" placeholder="Confirm password" name="confirmPassword" required>

                            <span id="guide"></span>
                        </div>

                        <button type="button" class="showPasswordBtn btn2">Show</button>

                    </div>

                    <button id="signUpBtn" disabled>Sign up</button>

                </form>

            </div> 

        </main>

        <footer class="footer">

            <p>
                Already have an account? <a href="login.html" class="link">Log in.</a>
            </p>
            
        </footer>

        <script src="script.js" defer></script>
    </body>

</html>
